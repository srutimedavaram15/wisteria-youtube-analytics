name: Run Tests and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west2-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build --platform linux/amd64 \
            -t us-west2-docker.pkg.dev/youtube-analytics-tool-507823/wisteria-repo/wisteria \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy wisteria \
            --image us-west2-docker.pkg.dev/youtube-analytics-tool-507823/wisteria-repo/wisteria \
            --region us-west2 \
            --allow-unauthenticated \
            --memory=1Gi \
            --set-secrets=/secrets/client_secret_web.json=client-secret-web:latest \
            --set-env-vars SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT }},SNOWFLAKE_USER=${{ secrets.SNOWFLAKE_USER }},SNOWFLAKE_PASSWORD=${{ secrets.SNOWFLAKE_PASSWORD }},SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE }},SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }},SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
